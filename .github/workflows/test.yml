name: Tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm run check
      - run: npm run test:coverage
      - name: Install browser regression runner
        run: npm install --no-save --package-lock=false playwright@1.62.1
      - name: Install test browser
        run: npx playwright install --with-deps chromium
      - name: Verify desktop and mobile shortlist journeys
        run: node scripts/browser-check.mjs
